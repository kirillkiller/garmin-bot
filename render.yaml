services:
  - type: cron
    name: garmin-daily-sync
    env: python
    schedule: "0 7 * * *"  # Každý den v 7:00 UTC (8:00 CET v létě, 9:00 CET v zimě) - později, aby měl Garmin čas synchronizovat všechna data
    buildCommand: pip install -r requirements.txt
    startCommand: python3 daily_sync_improved.py --once
    envVars:
      - key: GARMIN_EMAIL
        sync: false
      - key: GARMIN_PASSWORD
        sync: false
      - key: GOOGLE_SHEET_ID
        sync: false
      - key: GOOGLE_CREDENTIALS_PATH
        value: credentials.json
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: TELEGRAM_NOTIFY_SUCCESS
        value: "false"

